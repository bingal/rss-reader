name: Build Multi-Platform RSS Reader App

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  # Check code quality
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: TypeScript check
        run: bunx tsc --noEmit

      - name: Run tests
        run: bun run test:run

  # Build for macOS ARM64
  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-14
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build with ElectroBun
        run: bun run build:stable

      - name: Find DMG artifact
        id: dmg
        run: |
          DMG=$(find artifacts -name "*.dmg" | head -1)
          echo "dmg=$DMG" >> $GITHUB_OUTPUT

      - name: Rename artifact
        run: |
          mv "${{ steps.dmg.outputs.dmg }}" "artifacts/RSSReader-v${{ vars.VERSION }}-macos-arm64.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rss-reader-macos-arm64
          path: artifacts/RSSReader-v${{ vars.VERSION }}-macos-arm64.dmg
          if-no-files-found: error

  # Build for macOS x64 (Intel)
  build-macos-x64:
    name: Build macOS x64
    runs-on: macos-14
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build with ElectroBun
        run: bun run build:stable

      - name: Find DMG artifact
        id: dmg
        run: |
          DMG=$(find artifacts -name "*.dmg" | head -1)
          echo "dmg=$DMG" >> $GITHUB_OUTPUT

      - name: Rename artifact
        run: |
          mv "${{ steps.dmg.outputs.dmg }}" "artifacts/RSSReader-v${{ vars.VERSION }}-macos-x64.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rss-reader-macos-x64
          path: artifacts/RSSReader-v${{ vars.VERSION }}-macos-x64.dmg
          if-no-files-found: error

  # Build for Windows
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build with ElectroBun
        run: bun run build:stable

      - name: Find ZIP artifact
        id: zip
        run: |
          ZIP=$(find artifacts -name "*.zip" | head -1)
          echo "zip=$ZIP" >> $GITHUB_OUTPUT

      - name: Rename artifact
        run: |
          mv "${{ steps.zip.outputs.zip }}" "artifacts/RSSReader-v${{ vars.VERSION }}-win-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rss-reader-windows
          path: artifacts/RSSReader-v${{ vars.VERSION }}-win-x64.zip
          if-no-files-found: error

  # Build for Linux
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build with ElectroBun
        run: bun run build:stable

      - name: Find tar.gz artifact
        id: tar
        run: |
          TAR=$(find artifacts -name "*.tar.gz" | head -1)
          echo "tar=$TAR" >> $GITHUB_OUTPUT

      - name: Rename artifact
        run: |
          mv "${{ steps.tar.outputs.tar }}" "artifacts/RSSReader-v${{ vars.VERSION }}-linux-x64.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rss-reader-linux
          path: artifacts/RSSReader-v${{ vars.VERSION }}-linux-x64.tar.gz
          if-no-files-found: error

  # Create release on tag
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-macos-arm64, build-macos-x64, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: rss-reader-macos-arm64
          path: release

      - name: Download macOS x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: rss-reader-macos-x64
          path: release

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: rss-reader-windows
          path: release

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: rss-reader-linux
          path: release

      - name: List files
        run: ls -la release/

      - name: Delete existing release if exists
        run: |
          gh release delete ${{ github.ref_name }} --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: RSS Reader v${{ steps.version.outputs.version }}
          files: |
            release/*.dmg
            release/*.zip
            release/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
