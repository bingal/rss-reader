name: Build Multi-Platform RSS Reader App

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  # Check code quality
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: TypeScript check
        run: bunx tsc --noEmit

      - name: Run tests
        run: bun run test:run

  # Build for macOS (ARM64 + Intel Universal)
  build-macos:
    name: Build macOS
    runs-on: macos-14
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build ElectroBun app (ARM64)
        run: |
          bun build src/bun/index.ts --compile --target=bun-darwin-arm64 --outfile dist/rss-reader-arm64

      - name: Build ElectroBun app (Intel)
        run: |
          bun build src/bun/index.ts --compile --target=bun-darwin-x64 --outfile dist/rss-reader-intel

      - name: Create Universal Binary
        run: |
          lipo -create dist/rss-reader-arm64 dist/rss-reader-intel -output dist/rss-reader
          chmod +x dist/rss-reader
          lipo -info dist/rss-reader

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rss-reader-macos
          path: dist/rss-reader
          if-no-files-found: error

  # Build for Windows
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build ElectroBun app
        run: |
          bun build src/bun/index.ts --compile --target=bun-windows-x64 --outfile dist/rss-reader.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rss-reader-windows
          path: dist/rss-reader.exe
          if-no-files-found: error

  # Build for Linux
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build ElectroBun app
        run: |
          bun build src/bun/index.ts --compile --target=bun-linux-x64 --outfile dist/rss-reader-linux
          chmod +x dist/rss-reader-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rss-reader-linux
          path: dist/rss-reader-linux
          if-no-files-found: error

  # Create release on tag
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: rss-reader-macos
          path: release

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: rss-reader-windows
          path: release

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: rss-reader-linux
          path: release

      - name: Rename files for release
        run: |
          cd release
          mv rss-reader rss-reader-macos
          mv rss-reader.exe rss-reader-windows.exe
          ls -la

      - name: Delete existing release if exists
        run: |
          gh release delete ${{ github.ref_name }} --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: RSS Reader ${{ github.ref_name }}
          files: |
            release/rss-reader-macos
            release/rss-reader-windows.exe
            release/rss-reader-linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
