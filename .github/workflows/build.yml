name: Build Multi-Platform RSS Reader App

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  # Check code quality
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: TypeScript check
        run: bunx tsc --noEmit

      - name: Run tests
        run: bun run test:run

  # Build for macOS ARM64
  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-14
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: bun build src/bun/index.ts --compile --target=bun-darwin-arm64 --outfile dist/rss-reader

      - name: Create .app bundle
        run: |
          mkdir -p "RSS Reader.app/Contents/MacOS"
          cp dist/rss-reader "RSS Reader.app/Contents/MacOS/RSS Reader"
          chmod +x "RSS Reader.app/Contents/MacOS/RSS Reader"

          # Create Info.plist
          cat > "RSS Reader.app/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>RSS Reader</string>
            <key>CFBundleIdentifier</key>
            <string>com.rssreader.app</string>
            <key>CFBundleName</key>
            <string>RSS Reader</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>0.2.3</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSMinimumSystemVersion</key>
            <string>10.15</string>
          </dict>
          </plist>
          EOF

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          create-dmg \
            --volname "RSS Reader" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "RSS Reader.app" 150 185 \
            --app-drop-link 450 185 \
            "dist/RSSReader-0.2.3-macos-arm64.dmg" \
            "RSS Reader.app" || true

          # Fallback
          if [ ! -f "dist/RSSReader-0.2.3-macos-arm64.dmg" ]; then
            create-dmg "dist/RSSReader-0.2.3-macos-arm64.dmg" "RSS Reader.app"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rss-reader-macos-arm64
          path: dist/RSSReader-0.2.3-macos-arm64.dmg
          if-no-files-found: error

  # Build for macOS x64
  build-macos-x64:
    name: Build macOS x64
    runs-on: macos-14
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: bun build src/bun/index.ts --compile --target=bun-darwin-x64 --outfile dist/rss-reader

      - name: Create .app bundle
        run: |
          mkdir -p "RSS Reader.app/Contents/MacOS"
          cp dist/rss-reader "RSS Reader.app/Contents/MacOS/RSS Reader"
          chmod +x "RSS Reader.app/Contents/MacOS/RSS Reader"

          cat > "RSS Reader.app/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>RSS Reader</string>
            <key>CFBundleIdentifier</key>
            <string>com.rssreader.app</string>
            <key>CFBundleName</key>
            <string>RSS Reader</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>0.2.3</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSMinimumSystemVersion</key>
            <string>10.15</string>
          </dict>
          </plist>
          EOF

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          create-dmg "dist/RSSReader-0.2.3-macos-x64.dmg" "RSS Reader.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rss-reader-macos-x64
          path: dist/RSSReader-0.2.3-macos-x64.dmg
          if-no-files-found: error

  # Build for Windows
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: bun build src/bun/index.ts --compile --target=bun-windows-x64 --outfile dist/RSSReader.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rss-reader-windows
          path: dist/RSSReader.exe
          if-no-files-found: error

  # Build for Linux
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: |
          bun build src/bun/index.ts --compile --target=bun-linux-x64 --outfile dist/RSSReader
          chmod +x dist/RSSReader

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rss-reader-linux
          path: dist/RSSReader
          if-no-files-found: error

  # Create release on tag
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-macos-arm64, build-macos-x64, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: rss-reader-macos-arm64
          path: release

      - name: Download macOS x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: rss-reader-macos-x64
          path: release

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: rss-reader-windows
          path: release

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: rss-reader-linux
          path: release

      - name: List files
        run: ls -la release/

      - name: Delete existing release if exists
        run: |
          gh release delete ${{ github.ref_name }} --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: RSS Reader v${{ steps.version.outputs.version }}
          files: |
            release/RSSReader-0.2.3-macos-arm64.dmg
            release/RSSReader-0.2.3-macos-x64.dmg
            release/RSSReader.exe
            release/RSSReader
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
